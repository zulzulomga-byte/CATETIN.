<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F4FB">
<title>Catetin</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Literata:opsz,wght@7..72,400..600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#15173D; --ink2:#5B5E85; --cobalt:#3A36F5; --paper:#F3F4FB; --sheet:#fff;
  --hl:#FFE53D; --coral:#FF5236; --pink:#FF9CC2;
  --ui:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  --read:"Literata",Georgia,"Times New Roman",serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
body[data-view=record]{background:var(--cobalt)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px;border-radius:6px}
body[data-view=record] :focus-visible{outline-color:var(--hl)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.screen{max-width:560px;margin:0 auto;padding:calc(var(--st) + 14px) 20px calc(var(--sb) + 120px)}
.ic{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;flex:none}
.ic:active{background:rgba(21,23,61,.1)}
.dock{position:fixed;left:0;right:0;bottom:calc(var(--sb) + 22px);display:flex;justify-content:center;pointer-events:none;z-index:5}
.dock>*{pointer-events:auto}

/* tombol */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:17px;padding:14px 26px;border-radius:999px;border:2px solid var(--ink);background:#fff;color:var(--ink);box-shadow:4px 4px 0 var(--ink);transition:transform .08s,box-shadow .08s;text-align:center}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.coral{background:var(--coral)}
.btn.yellow{background:var(--hl)}
.btn.ink{background:var(--ink);color:#fff;box-shadow:none}
.btn.ink:active{transform:none;opacity:.85}
.btn.big{font-size:20px;padding:17px 34px}
.btn.small{font-size:15px;padding:9px 18px;box-shadow:3px 3px 0 var(--ink)}
.btn.wide{grid-column:1/-1}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.plain{border-color:transparent;box-shadow:none;background:transparent}

/* beranda */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:30px;letter-spacing:-.03em}
.logo i{width:15px;height:15px;border-radius:50%;background:var(--coral);border:2px solid var(--ink);display:block}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -20px 12px;padding:4px 20px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:8px;padding:8px 15px;border:2px solid var(--ink);border-radius:999px;font-weight:600;font-size:15px;background:#fff;white-space:nowrap}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c);border:1.5px solid var(--ink);display:block}
.chip[aria-pressed=true]{background:var(--ink);color:#fff}
.note{display:block;width:100%;background:var(--hl);border:2px solid var(--ink);border-radius:6px 6px 6px 24px;padding:14px 18px;margin:6px 0 18px;font-weight:600;transform:rotate(-1deg)}
.note u{display:block;margin-top:4px;font-weight:700}
.row{display:grid;grid-template-columns:10px 1fr;gap:14px;width:100%;background:var(--sheet);border:2px solid var(--ink);border-radius:14px;padding:14px 16px 14px 12px;margin-bottom:12px}
.row:active{background:#ECEDFB}
.row .tab{border-radius:6px;background:var(--c);border:2px solid var(--ink)}
.rb{display:flex;flex-direction:column;gap:6px;min-width:0}
.rt{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.rt b{font-size:19px;font-weight:700;line-height:1.2;letter-spacing:-.01em}
.rm{display:flex;gap:16px;font-size:13.5px;color:var(--ink2);font-weight:500}
.rp{font-family:var(--read);font-size:14.5px;line-height:1.45;color:rgba(21,23,61,.78);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pill{flex:none;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;border:2px solid var(--ink);line-height:1.3}
.pill.busy{background:var(--hl)}
.pill.fail{background:var(--coral)}
.empty{text-align:center;padding:44px 12px 0}
.empty svg{width:200px;height:auto;display:block;margin:0 auto 22px}
.empty h2{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-bottom:8px}
.empty p{color:var(--ink2);max-width:290px;margin:0 auto}

/* rekam */
.rec{color:#fff}
.rec .ic:active{background:rgba(255,255,255,.18)}
.q{font-size:42px;line-height:1;font-weight:800;letter-spacing:-.03em;margin:18px 0 0}
.field{width:100%;margin-top:24px;padding:16px 18px;font-size:20px;font-weight:600;background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:12px;box-shadow:4px 4px 0 var(--ink)}
.field::placeholder{color:#8C8FB3;font-weight:500}
.awake{margin-left:auto;font-size:13px;font-weight:600;color:rgba(255,255,255,.88)}
.sbox{width:100%;padding:12px 18px;border:2px solid var(--ink);border-radius:999px;background:#fff;font-size:16px;margin:2px 0 14px;-webkit-appearance:none;appearance:none}
.sbox::placeholder{color:#8C8FB3}
.lnk{display:block;margin:2px 0 0 36px;padding:8px 0;font-weight:700;font-size:14px;text-decoration:underline}
mark.hit{background:var(--hl);color:var(--ink);padding:0 2px;border-radius:3px}
.sc.tabs button{font-size:14px;padding:11px 4px}
.tools{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.tools .sbox{margin:0;flex:1;min-width:0;padding:10px 16px;font-size:15px}
.ncount{font-size:13px;color:var(--ink2);margin:0 0 8px 6px;min-height:0}
.ncount:empty{display:none}
.seg.edit{border-bottom:2px dashed rgba(58,54,245,.55)}
.seg.u{color:var(--cobalt)}
.ta{width:100%;font-family:var(--read);font-size:17px;line-height:1.5;padding:12px 14px;border:2px solid var(--ink);border-radius:12px;resize:vertical;margin-bottom:16px;background:#fff;color:var(--ink)}
.del2{color:#C5301A;font-weight:700;padding:12px;text-align:center}
.bq{display:block;width:fit-content;max-width:86%;background:var(--ink);color:#fff;border-radius:16px 16px 4px 16px;padding:11px 15px;margin:16px 0 8px auto;font-weight:500}
.ba{max-width:96%;background:#fff;border:2px solid var(--ink);border-radius:16px 16px 16px 4px;padding:14px 16px}
.ba p+p{margin-top:8px}
.cite{display:inline-flex;align-items:center;gap:4px;background:var(--hl);border:1.5px solid var(--ink);border-radius:999px;padding:1px 9px;font:700 12.5px var(--ui);margin:0 2px;vertical-align:1px}
.askbar{position:sticky;bottom:calc(var(--sb) + 14px);display:flex;gap:8px;align-items:center;margin-top:18px;padding:10px 0 2px;background:linear-gradient(rgba(243,244,251,0),var(--paper) 35%)}
.askbar .sbox{margin:0;flex:1;min-width:0}
.sug{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.sug .chip{white-space:normal;text-align:left;font-weight:600}
.qq{font-family:var(--read);font-size:19px;line-height:1.5;margin:14px 0 16px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:13px 14px;border:2px solid var(--ink);border-radius:12px;background:#fff;margin-bottom:10px;font-family:var(--read);font-size:16.5px;line-height:1.45;color:var(--ink)}
.opt b{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font:700 13px var(--ui)}
.opt.ok{background:#CDF6E7}
.opt.bad{background:#FFDAD3}
.opt.dim{opacity:.55}
.why{border:2px dashed var(--ink);border-radius:12px;padding:12px 14px;margin:6px 0 14px;font-family:var(--read);font-size:15.5px;line-height:1.5}
.fcard{display:flex;flex-direction:column;justify-content:center;gap:14px;width:100%;min-height:240px;padding:24px;border:2px solid var(--ink);border-radius:18px;background:#fff;box-shadow:5px 5px 0 var(--ink);text-align:center}
.fcard.back{background:var(--hl)}
.fcard small{font-size:13px;font-weight:700;color:var(--ink2)}
.fcard span{font-family:var(--read);font-size:21px;line-height:1.4}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.stat{font-weight:700;margin:6px 0}
.field.sm{margin-top:14px;font-size:16px;padding:13px 16px;box-shadow:3px 3px 0 var(--ink)}
.recent{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.cw{border:2px solid #fff;border-radius:999px;padding:8px 15px;font-weight:600;font-size:15px}
.cw:active{background:rgba(255,255,255,.2)}
.hint{margin-top:22px;color:rgba(255,255,255,.82);max-width:300px}
.live{display:flex;flex-direction:column;min-height:100dvh;padding-bottom:calc(var(--sb) + 24px)}
.state{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.pulse{width:14px;height:14px;border-radius:50%;background:var(--coral);border:2px solid #fff;animation:pl 1.4s ease-in-out infinite}
.pulse.off{animation:none;background:transparent}
@keyframes pl{50%{transform:scale(.6);opacity:.5}}
.course{font-size:22px;font-weight:700;margin-top:14px;letter-spacing:-.01em}
.timer{font-size:clamp(44px,15vw,76px);font-weight:800;letter-spacing:-.03em;line-height:1;margin-top:26px;font-variant-numeric:tabular-nums}
#wave{display:block;width:100%;height:132px;margin:22px 0 8px}
.info{min-height:24px;color:rgba(255,255,255,.88);font-size:15px}
.ctrls{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:auto;padding-top:24px}

/* catatan */
.bar{display:flex;align-items:center;gap:4px;margin:0 -10px}
.bar h1{flex:1;min-width:0;font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;gap:16px;color:var(--ink2);font-size:14px;font-weight:500;margin:4px 0 0 36px}
.sc{display:flex;border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:#fff}
.sc button{flex:1;padding:11px 10px;text-align:center;font-weight:600;font-size:15px}
.sc button+button{border-left:2px solid var(--ink)}
.sc [aria-selected=true],.sc [aria-checked=true]{background:var(--ink);color:#fff}
.sc.tabs{margin:16px 0}
.banner{border:2px solid var(--ink);border-radius:14px;padding:14px 16px;margin-top:14px;background:#fff;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.banner.fail{background:#FFDAD3}
.prog{width:100%;height:14px;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff}
.prog i{display:block;height:100%;background:var(--hl);transition:width .4s}
.page{position:relative;background-color:var(--sheet);background-image:repeating-linear-gradient(to bottom,transparent 0 31px,rgba(58,54,245,.15) 31px 32px);border:2px solid var(--ink);border-radius:14px;padding:32px 0 0;overflow:hidden}
.page::before{content:"";position:absolute;top:0;bottom:0;left:70px;width:2px;background:var(--pink)}
.para{display:grid;grid-template-columns:70px 1fr;margin-bottom:32px}
.tsb{display:flex;align-items:center;justify-content:center;gap:4px;height:32px;font-size:12.5px;font-weight:700;color:var(--ink2);width:100%}
.tsb:active{color:var(--cobalt)}
.txt{font-family:var(--read);font-size:17px;line-height:32px;padding:0 16px 0 16px}
.seg{cursor:pointer;background:linear-gradient(transparent 50%,var(--hl) 50% 94%,transparent 94%) no-repeat 0 0/0% 100%;transition:background-size .28s ease-out;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.seg.hl{background-size:100% 100%}
.blank{padding:0 22px 32px 86px;font-family:var(--read);color:var(--ink2);line-height:32px}
.sheetbox{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:22px 20px}
.sum h3{font-size:20px;font-weight:800;letter-spacing:-.01em;margin:22px 0 8px}
.sum h3:first-child{margin-top:0}
.sum p,.sum li{font-family:var(--read);font-size:16.5px;line-height:1.6}
.sum ul,.sum ol{margin:0;padding-left:22px}
.sum li{margin-bottom:6px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.empty-sum{text-align:center;padding:10px 4px}
.empty-sum p{margin-bottom:18px;color:var(--ink2)}
.del{display:block;margin:30px auto 0;color:#C5301A;font-weight:700;padding:12px}

/* pengaturan */
.fl{margin-top:26px}
.fl>label,.fl>span{display:block;font-weight:700;font-size:17px;margin-bottom:10px}
.fl small{display:block;margin-top:8px;color:var(--ink2);font-size:14px}
.kf{display:flex;gap:8px}
.kf input{flex:1;min-width:0;padding:13px 14px;border:2px solid var(--ink);border-radius:12px;background:#fff;font-size:16px}
.kf button{flex:none;padding:0 14px;border:2px solid var(--ink);border-radius:12px;font-weight:600;background:#fff}

/* lain-lain */
.mini{position:fixed;left:16px;right:16px;top:calc(var(--st) + 10px);max-width:528px;margin:0 auto;background:var(--ink);color:#fff;border-radius:14px;padding:10px 12px 10px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:600;z-index:6}
.mini .btn{background:#fff;color:var(--ink)}
#toast{position:fixed;left:50%;bottom:calc(var(--sb) + 104px);transform:translate(-50%,10px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:15px;max-width:min(92vw,420px);text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;border:2px solid #fff}
#toast.on{opacity:1;transform:translate(-50%,0)}
body[data-view=record] #toast{bottom:calc(var(--sb) + 200px)}
.scrim{position:fixed;inset:0;background:rgba(21,23,61,.5);z-index:30}
.sheet{max-height:92dvh;overflow:auto;position:fixed;left:0;right:0;bottom:0;background:#fff;border:2px solid var(--ink);border-bottom:0;border-radius:24px 24px 0 0;padding:26px 22px calc(var(--sb) + 22px);z-index:31;max-width:560px;margin:0 auto;animation:up .22s ease-out}
.sheet p{font-size:19px;font-weight:600;line-height:1.35;margin-bottom:22px}
.sheet .row2{display:grid;gap:10px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
</style>
</head>
<body data-view="home">
<div id="app"></div>
<div class="mini" id="mini" hidden><span id="miniT"></span><button class="btn small" data-act="stopPlay">Berhenti</button></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="sheet-root"></div>
<audio id="player" preload="none"></audio>

<script>
(() => {
'use strict';

/* ---------- util ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pad = n => String(n).padStart(2, '0');
const fmtClock = t => { t = Math.floor(t); return `${pad(Math.floor(t/3600))}:${pad(Math.floor(t%3600/60))}:${pad(t%60)}`; };
const fmtStamp = t => { t = Math.floor(t); const h = Math.floor(t/3600), m = Math.floor(t%3600/60), s = t%60; return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`; };
const fmtDur = t => { if (t < 60) return `${Math.round(t)} dtk`; const h = Math.floor(t/3600), m = Math.round(t%3600/60); return h ? `${h} j ${m} mnt` : `${m} mnt`; };
const DF = new Intl.DateTimeFormat('id-ID', { weekday: 'short', day: 'numeric', month: 'short' });
const TF = new Intl.DateTimeFormat('id-ID', { hour: '2-digit', minute: '2-digit' });
const DFL = new Intl.DateTimeFormat('id-ID', { dateStyle: 'full', timeStyle: 'short' });
const COLORS = ['#FFE53D', '#FF9CC2', '#7DE3C0', '#8FD0FF', '#FFB35C'];
const colorFor = n => { let h = 0; for (const c of n.toLowerCase().trim()) h = (h * 31 + c.charCodeAt(0)) >>> 0; return COLORS[h % COLORS.length]; };
class AppErr extends Error {}

const ic = (p, s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const I = {
  mic: ic('<path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>', 24),
  sliders: ic('<path d="M4 7h9M18 7h2M4 17h2M11 17h9"/><circle cx="15.5" cy="7" r="2.2"/><circle cx="8.5" cy="17" r="2.2"/>', 24),
  back: ic('<path d="M15 5l-7 7 7 7"/>', 24),
  x: ic('<path d="M6 6l12 12M18 6L6 18"/>', 24),
  pause: ic('<path d="M8 5v14M16 5v14"/>'),
  play: '<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 3.5l14 8.5-14 8.5z"/></svg>',
  flag: ic('<path d="M6 21V4M6 5h11l-2 4 2 4H6"/>'),
  copy: ic('<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/>'),
  share: ic('<path d="M12 15V4M8 8l4-4 4 4M5 13v6h14v-6"/>'),
  retry: ic('<path d="M4 12a8 8 0 1 0 3-6.2M4 4v5h5"/>', 20),
};

/* ---------- penyimpanan ---------- */
const mem = { sessions: new Map(), audio: new Map() };
let db = null;
const openDB = () => new Promise(res => {
  try {
    const r = indexedDB.open('catetin', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('sessions', { keyPath: 'id' }); r.result.createObjectStore('audio'); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => res(null);
  } catch (e) { res(null); }
});
const tx = (store, mode, fn) => new Promise((res, rej) => {
  const t = db.transaction(store, mode); const rq = fn(t.objectStore(store));
  t.oncomplete = () => res(rq && rq.result); t.onerror = t.onabort = () => rej(t.error);
});
const DB = {
  all: async () => db ? tx('sessions', 'readonly', s => s.getAll()) : [...mem.sessions.values()],
  put: async s => { if (!db) { mem.sessions.set(s.id, JSON.parse(JSON.stringify(s))); return; } return tx('sessions', 'readwrite', st => st.put(JSON.parse(JSON.stringify(s)))); },
  del: async id => { if (!db) { mem.sessions.delete(id); return; } return tx('sessions', 'readwrite', st => st.delete(id)); },
  putAudio: async (k, b) => { if (!db) { mem.audio.set(k, b); return; } return tx('audio', 'readwrite', st => st.put(b, k)); },
  getAudio: async k => db ? tx('audio', 'readonly', st => st.get(k)) : mem.audio.get(k),
  delAudio: async k => { if (!db) { mem.audio.delete(k); return; } return tx('audio', 'readwrite', st => st.delete(k)); },
};

const SKEY = 'catetin.settings';
let settings = { key: '', model: 'whisper-large-v3', lang: 'id', chunkMin: 8, llm: 'llama-3.3-70b-versatile', terms: {}, autoSum: 'off' };
try { const v = localStorage.getItem(SKEY); if (v) settings = { ...settings, ...JSON.parse(v) }; } catch (e) {}
const saveSettings = () => { try { localStorage.setItem(SKEY, JSON.stringify(settings)); } catch (e) {} };
if (settings.v !== 2) { settings.model = 'whisper-large-v3'; settings.v = 2; saveSettings(); }

const GROQ = 'https://api.groq.com/openai/v1';
const LLM = 'llama-3.3-70b-versatile';

/* ---------- state ---------- */
const softRender = () => { if (S.view !== 'record') render(true); };
const S = { view: 'home', sessions: [], filter: 'all', openId: null, tab: 'text', course: '', R: null, sumBusy: null, sumMsg: '', terms: '', sumStyle: 'full', q: '', edit: false, nq: '', aq: '', askBusy: null, askQ: '', quizBusy: null, qmode: 'mcq', qz: null, fc: null };
const getS = id => S.sessions.find(s => s.id === id);

/* ---------- data turunan ---------- */
const segsOf = s => {
  const out = [];
  for (const c of s.chunks) {
    if (c.status !== 'done') continue;

function md(t) {
  const out = []; let mode = '';
  const bold = x => x.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  const close = () => { if (mode) out.push(`</${mode}>`); mode = ''; };
  for (let ln of esc(t).split('\n')) {
    ln = ln.trim();
    if (!ln) { close(); continue; }
    if (/^#{1,4}\s/.test(ln)) { close(); out.push(`<h3>${bold(ln.replace(/^#{1,4}\s/, ''))}</h3>`); }
    else if (/^[-*•]\s/.test(ln)) { if (mode !== 'ul') { close(); out.push('<ul>'); mode = 'ul'; } out.push(`<li>${bold(ln.slice(2))}</li>`); }
    else if (/^\d+[.)]\s/.test(ln)) { if (mode !== 'ol') { close(); out.push('<ol>'); mode = 'ol'; } out.push(`<li>${bold(ln.replace(/^\d+[.)]\s/, ''))}</li>`); }
    else { close(); out.push(`<p>${bold(ln)}</p>`); }
  }
  close(); return out.join('');
}

/* ---------- perekaman ---------- */
const NPTS = 40;
const elapsed = () => { const R = S.R; return R ? R.accum + (R.running ? (performance.now() - R.t0) / 1000 : 0) : 0; };
const pickMime = () => ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';

const getMic = () => navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: false, noiseSuppression: false, autoGainControl: true } });

function markLost() {
  const R = S.R; if (!R || R.lost) return;
  if (R.running) { R.accum += (performance.now() - R.t0) / 1000; R.running = false; }
  R.lost = true;
  const st = $('#state'); if (st) st.textContent = 'Terhenti';
  const pl = $('#pulse'); if (pl) pl.classList.add('off');
  const pb = $('#pauseBtn'); if (pb) pb.innerHTML = I.play + 'Lanjut';
  toast('Rekaman terhenti, mungkin karena layar terkunci. Tekan Lanjut untuk meneruskan.');
}
function checkLost() {
  const R = S.R; if (!R || R.lost || !R.running) return;
  const t = R.stream.getAudioTracks()[0];
  if ((t && t.readyState === 'ended') || R.cur.mr.state === 'inactive') markLost();
}
async function resumeLost() {
  const R = S.R; if (!R || !R.lost || R.resuming) return; R.resuming = true;
  try {
    const stream = await getMic();
    try { if (R.cur.mr.state !== 'inactive') { if (R.cur.endSec === undefined) R.cur.endSec = elapsed(); R.cur.mr.stop(); } } catch (e) {}
    R.pending.push(R.cur.done);
    R.stream.getTracks().forEach(t => t.stop());
    R.stream = stream; R.ctx.createMediaStreamSource(stream).connect(R.an);
    if (R.ctx.state === 'suspended') await R.ctx.resume();
    watchTrack(R, stream);
    R.lost = false; R.t0 = performance.now(); R.running = true; startRecorder(); keepAwakeOn();
    const pb = $('#pauseBtn'); if (pb) pb.innerHTML = I.pause + 'Jeda';
    const st = $('#state'); if (st) st.textContent = 'Merekam';
    const pl = $('#pulse'); if (pl) pl.classList.remove('off');
  } catch (e) { toast('Mikrofon belum bisa dipakai. Pastikan aplikasi terbuka, lalu coba lagi.'); }
  R.resuming = false;
}
async function saveTmp() {
  const R = S.R; if (!R || !R.running || !R.cur || !R.cur.parts.length) return;
  const cur = R.cur, s = R.session;
  try {
    await DB.putAudio(`${s.id}:tmp`, new Blob(cur.parts, { type: cur.mime }));
    s.tmp = { idx: cur.idx, start: cur.startSec, dur: elapsed() - cur.startSec, mime: cur.mime };
    await DB.put(s);
  } catch (e) {}
}
async function startRec() {

  const course = (S.course || '').trim() || 'Kuliah tanpa judul';
  const terms = (S.terms || '').trim().slice(0, 300);
  if (terms) { settings.terms[course] = terms; saveSettings(); }
  let stream;
  try { stream = await getMic(); }
  catch (e) { toast('Mikrofon tidak bisa dipakai. Izinkan akses mikrofon untuk Catetin.'); return; }
  const session = { id: uid(), course, terms, createdAt: Date.now(), duration: 0, status: 'recording', chunks: [], marks: [], hl: {}, summary: '' };

function parseJson(t) {
  t = String(t).replace(/```json|```/g, '').trim();
  try { return JSON.parse(t); } catch (e) { const m = t.match(/\{[\s\S]*\}/); if (m) { try { return JSON.parse(m[0]); } catch (_) {} } return {}; }
}
const QUIZ_SYS = 'Kamu pembuat soal latihan untuk mahasiswa. Buat soal yang bisa dijawab dari isi transkrip kuliah, dalam bahasa Indonesia, tanpa mengarang fakta di luar transkrip. Transkrip hasil speech-to-text bisa ada salah dengar, jangan buat soal dari kata yang janggal. Balas hanya JSON valid.';
async function makeQuiz() {
  const s = getS(S.openId); if (!s || S.quizBusy) return;
  if (!settings.key) { toast('Kunci Groq belum diisi. Isi di Pengaturan dulu.'); return; }
  const words = textOf(s).split(/\s+/); let parts = [];
  for (let i = 0; i < words.length; i += 2200) parts.push(words.slice(i, i + 2200).join(' '));
  if (!parts[0]) return;
  if (parts.length > 6) parts = [0, 1, 2, 3, 4, 5].map(k => parts[Math.floor(k * (parts.length - 1) / 5)]);
  S.quizBusy = s.id; S.sumMsg = 'Menyusun soal'; softRender();
  try {
    const mcq = [], cards = [];
    for (let i = 0; i < parts.length; i++) {
      S.sumMsg = `Membuat soal bagian ${i + 1} dari ${parts.length}`; softRender();
      const out = await groqChat([{ role: 'system', content: QUIZ_SYS }, { role: 'user', content: `${ctxOf(s, false)}\n\nBuat 3 soal pilihan ganda dan 4 kartu belajar dari bagian transkrip ini. Balas HANYA JSON dengan bentuk {"kuis":[{"q":"...","opsi":["...","...","...","..."],"jawab":0,"info":"..."}],"kartu":[{"depan":"...","belakang":"..."}]}. "jawab" adalah nomor opsi yang benar (0 sampai 3) dan "info" adalah penjelasan singkat. Kartu berisi istilah atau pertanyaan di depan dan jawaban singkat di belakang.\n\nTranskrip:\n${parts[i]}` }], { json: true });
      const j = parseJson(out);
      for (const q of (j.kuis || [])) {
        if (q && typeof q.q === 'string' && Array.isArray(q.opsi) && q.opsi.length === 4 && Number.isInteger(q.jawab) && q.jawab >= 0 && q.jawab < 4) {
          const o = shuffle(q.opsi.map((t, k) => ({ t: String(t), ok: k === q.jawab })));
          mcq.push({ q: q.q, opsi: o.map(x => x.t), jawab: o.findIndex(x => x.ok), info: String(q.info || '') });
        }
      }
      for (const c of (j.kartu || [])) if (c && c.depan && c.belakang) cards.push({ depan: String(c.depan), belakang: String(c.belakang) });
    }
    if (!mcq.length && !cards.length) throw new AppErr('Soal belum berhasil dibuat. Coba lagi.');
    s.quiz = { mcq, cards, at: Date.now() }; await DB.put(s); S.qz = null; S.fc = null;
  } catch (e) { toast(e instanceof AppErr ? e.message : 'Soal gagal dibuat.'); }
  S.quizBusy = null; S.sumMsg = ''; softRender();
}
function quizHtml(s) {
  if (S.quizBusy === s.id) return `<div class="sheetbox empty-sum"><p>${esc(S.sumMsg || 'Menyusun soal')}</p><div class="prog"><i style="width:60%"></i></div></div>`;
  const qz = s.quiz;
  if (!qz) return `<div class="sheetbox empty-sum"><p>Soal pilihan ganda dan kartu belajar dibuat dari teks kuliah ini, lengkap dengan skor dan penjelasan.</p><button class="btn coral" data-act="quizMake" ${segsOf(s).length ? '' : 'disabled'}>Buat kuis dan kartu</button></div>`;
  const modes = [['mcq', `Pilihan ganda (${qz.mcq.length})`], ['card', `Kartu (${qz.cards.length})`]];
  return `<div class="sc" role="radiogroup" style="margin-bottom:14px">${modes.map(([v, l]) => `<button role="radio" aria-checked="${S.qmode === v}" data-act="qmode" data-v="${v}">${l}</button>`).join('')}</div>${S.qmode === 'card' ? cardsHtml(qz) : mcqHtml(qz)}<div class="acts"><button class="btn small" data-act="quizMake">Buat ulang soal</button></div>`;
}
function mcqHtml(qz) {
  if (!qz.mcq.length) return '<div class="sheetbox"><p>Belum ada soal pilihan ganda.</p></div>';
  const z = S.qz || (S.qz = { list: shuffle(qz.mcq.map((_, i) => i)), i: 0, picked: null, score: 0, wrong: [] });
  if (z.i >= z.list.length) {
    return `<div class="sheetbox"><h3 style="font-size:26px;font-weight:800">Skor ${z.score} dari ${z.list.length}</h3><p style="margin:8px 0 4px;color:var(--ink2)">${z.wrong.length ? `${z.wrong.length} soal masih salah.` : 'Semua benar, mantap!'}</p><div class="two">${z.wrong.length ? '<button class="btn small" data-act="qredo">Ulangi yang salah</button>' : ''}<button class="btn small ink" data-act="qrestart">Mulai ulang</button></div></div>`;
  }
  const q = qz.mcq[z.list[z.i]], L = ['A', 'B', 'C', 'D'];
  const opts = q.opsi.map((t, k) => {
    const c = z.picked === null ? '' : k === q.jawab ? ' ok' : k === z.picked ? ' bad' : ' dim';
    return `<button class="opt${c}" data-act="qpick" data-i="${k}" ${z.picked !== null ? 'disabled' : ''}><b>${L[k]}</b><span>${esc(t)}</span></button>`;
  }).join('');
  const after = z.picked !== null ? `${q.info ? `<div class="why">${esc(q.info)}</div>` : ''}<button class="btn coral" data-act="qnext">${z.i + 1 >= z.list.length ? 'Lihat skor' : 'Lanjut'}</button>` : '';
  return `<p class="stat">Soal ${z.i + 1} dari ${z.list.length}</p><div class="prog"><i style="width:${(z.i + (z.picked !== null ? 1 : 0)) / z.list.length * 100}%"></i></div><p class="qq">${esc(q.q)}</p>${opts}${after}`;
}
function cardsHtml(qz) {
  if (!qz.cards.length) return '<div class="sheetbox"><p>Belum ada kartu belajar.</p></div>';
  const f = S.fc || (S.fc = { queue: shuffle(qz.cards.map((_, i) => i)), flip: false, known: 0, total: qz.cards.length });
  if (!f.queue.length) return `<div class="sheetbox"><h3 style="font-size:26px;font-weight:800">Semua kartu hafal</h3><p style="margin:8px 0 14px;color:var(--ink2)">${f.total} kartu sudah kamu kuasai.</p><button class="btn small ink" data-act="fcredo">Ulangi</button></div>`;
  const c = qz.cards[f.queue[0]];
  return `<p class="stat">${f.known} dari ${f.total} sudah hafal</p><div class="prog"><i style="width:${f.known / f.total * 100}%"></i></div><div style="height:14px"></div><button class="fcard${f.flip ? ' back' : ''}" data-act="fcflip"><small>${f.flip ? 'Jawaban' : 'Pertanyaan, ketuk untuk membalik'}</small><span>${esc(f.flip ? c.belakang : c.depan)}</span></button>${f.flip ? '<div class="two"><button class="btn small" data-act="fcknow" data-v="0">Belum hafal</button><button class="btn small yellow" data-act="fcknow" data-v="1">Hafal</button></div>' : ''}`;
}

/* ---------- koreksi teks ---------- */
function editSheet({ title, val = '', allowMore = false }) {
  return new Promise(res => {
    const root = $('#sheet-root');
    root.innerHTML = `<div class="scrim" id="scrim"></div><div class="sheet" role="dialog" aria-modal="true"><p>${esc(title)}</p><textarea id="tx" class="ta" rows="5" maxlength="1200">${esc(val)}</textarea><div class="row2"><button class="btn ink" id="b-save">Simpan</button>${allowMore ? '<button class="btn small" id="b-add">Tambah kalimat setelahnya</button><button class="del2" id="b-del">Hapus kalimat ini</button>' : ''}<button class="btn plain" id="b-no">Batal</button></div></div>`;
    const done = v => { root.innerHTML = ''; res(v); }, t = $('#tx');
    $('#b-save').onclick = () => done({ a: 'save', text: t.value.trim() });
    if (allowMore) { $('#b-add').onclick = () => done({ a: 'add', text: t.value.trim() }); $('#b-del').onclick = () => done({ a: 'del' }); }
    $('#b-no').onclick = () => done(null); $('#scrim').onclick = () => done(null);
    t.focus(); t.setSelectionRange(t.value.length, t.value.length);
  });
}
function remapHl(s, ci, i, delta) {
  const nh = {};
  for (const [k, v] of Object.entries(s.hl)) {
    const [c, n] = k.split(':').map(Number);
    if (c !== ci) { nh[k] = v; continue; }
    if (delta > 0) nh[`${c}:${n > i ? n + 1 : n}`] = v;
    else if (n !== i) nh[`${c}:${n > i ? n - 1 : n}`] = v;
  }
  s.hl = nh;
}

/* ---------- pemutar ---------- */
const player = $('#player'); let playUrl = null;
async function playAt(sid, ci, t, abs) {
  const blob = await DB.getAudio(`${sid}:${ci}`);
  if (!blob) { toast('File rekaman tidak ditemukan.'); return; }
  if (playUrl) URL.revokeObjectURL(playUrl);
  playUrl = URL.createObjectURL(blob); player.src = playUrl;
  const start = () => { player.currentTime = Math.max(0, t - 1); player.play().catch(() => {}); };
  player.onloadedmetadata = () => {
    if (player.duration === Infinity) { player.currentTime = 1e101; player.ontimeupdate = () => { player.ontimeupdate = null; start(); }; } else start();
  };
  player.onended = stopPlay;
  $('#miniT').textContent = `Memutar dari menit ${fmtStamp(abs)}`; $('#mini').hidden = false;
}
function stopPlay() { try { player.pause(); } catch (e) {} $('#mini').hidden = true; }

/* ---------- aksi ---------- */
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; }
  catch (e) { const ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (_) {} ta.remove(); return ok; }
}
const ACT = {
  open: el => go('session', el.dataset.id),
  filter: el => { S.filter = el.dataset.c; render(true); },
  settings: () => go('settings'),
  newRec: () => { S.course = ''; S.terms = ''; go('record'); },
  back: () => history.back(),
  pickCourse: el => { S.course = el.dataset.c; S.terms = settings.terms[S.course] || ''; const i = $('#course'), t = $('#terms'); if (i) i.value = S.course; if (t) t.value = S.terms; },
  startRec, pause: togglePause, mark, stopRec,
  tab: el => { S.tab = el.dataset.t; render(true); },
  play: el => playAt(S.openId, +el.dataset.ci, +el.dataset.t, +el.dataset.abs),
  stopPlay,
  hl: el => {
    const s = getS(S.openId), g = segsOf(s).find(x => x.k === el.dataset.k); if (!g) return;
    const v = !isHl(s, g); s.hl[g.k] = v; el.classList.toggle('hl', v); DB.put(s);
  },
  copy: async () => { const s = getS(S.openId); toast(await copyText(plainText(s)) ? 'Teks disalin.' : 'Teks gagal disalin.'); },
  copySum: async () => { const s = getS(S.openId); toast(await copyText(s.summary) ? 'Ringkasan disalin.' : 'Ringkasan gagal disalin.'); },
  share: async () => {
    const s = getS(S.openId), text = plainText(s);
    if (navigator.share) { try { await navigator.share({ title: s.course, text }); } catch (e) {} return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));
    a.download = (s.course.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'catatan') + '.txt'; a.click();
  },
  retry: () => { const s = getS(S.openId); s.chunks.filter(c => c.status === 'error').forEach(c => enqueue(s.id, c.idx)); render(true); },
  editMode: () => { S.edit = !S.edit; render(true); },
  editSeg: async el => {
    const s = getS(S.openId), [ci, i] = el.dataset.k.split(':').map(Number), c = s.chunks.find(x => x.idx === ci), g = c && c.segments[i];
    if (!g) return;
    const r = await editSheet({ title: 'Koreksi teks', val: g.t, allowMore: true }); if (!r) return;
    if (r.a === 'del') { c.segments.splice(i, 1); remapHl(s, ci, i, -1); }
    else {
      if (!r.text) { toast('Teks tidak boleh kosong. Pakai Hapus kalau mau membuang kalimat.'); return; }
      if (r.text !== g.t) { g.t = r.text; g.x = 1; }
      if (r.a === 'add') {
        const r2 = await editSheet({ title: 'Teks tambahan', val: '' });
        if (r2 && r2.text) { c.segments.splice(i + 1, 0, { s: g.e, e: g.e + 0.5, t: r2.text, u: 1 }); remapHl(s, ci, i, +1); }
      }
    }
    await DB.put(s); render(true);
  },
  addEnd: async () => {
    const s = getS(S.openId), done = s.chunks.filter(c => c.status === 'done'); if (!done.length) return;
    const c = done[done.length - 1], r = await editSheet({ title: 'Teks tambahan', val: '' }); if (!r || !r.text) return;
    const last = c.segments[c.segments.length - 1], at = last ? last.e : 0;
    c.segments.push({ s: at, e: at + 0.5, t: r.text, u: 1 });
    await DB.put(s); render(true);
  },
  askSend: () => askSend(), askSug: el => askSend(el.dataset.q),
  quizMake: () => makeQuiz(), qmode: el => { S.qmode = el.dataset.v; render(true); },
  qpick: el => {
    const s = getS(S.openId), z = S.qz; if (!z || z.picked !== null) return;
    const k = +el.dataset.i, qi = z.list[z.i], q = s.quiz.mcq[qi];
    z.picked = k; if (k === q.jawab) z.score++; else z.wrong.push(qi); render(true);
  },
  qnext: () => { S.qz.i++; S.qz.picked = null; render(false); },
  qredo: () => { S.qz = { list: S.qz.wrong.slice(), i: 0, picked: null, score: 0, wrong: [] }; render(false); },
  qrestart: () => { S.qz = null; render(false); },
  fcflip: () => { S.fc.flip = !S.fc.flip; render(true); },
  fcknow: el => { const f = S.fc, i = f.queue.shift(); if (el.dataset.v === '1') f.known++; else f.queue.push(i); f.flip = false; render(true); },
  fcredo: () => { S.fc = null; render(true); },
  rename: async () => {
    const s = getS(S.openId), v = await askText('Judul catatan', s.course);
    if (v && v.trim()) { s.course = v.trim().slice(0, 60); await DB.put(s); render(true); }
  },
  summarize,
  sumStyle: el => { S.sumStyle = el.dataset.v; render(true); },
  del: async () => {
    const s = getS(S.openId);
    if (!await ask('Hapus catatan ini? Rekaman dan teksnya hilang dari HP.', 'Hapus', 'Batal', true)) return;
    await removeSession(s); toast('Catatan dihapus.'); history.back();
  },
  set: el => { const k = el.dataset.k; settings[k] = k === 'chunkMin' ? +el.dataset.v : el.dataset.v; saveSettings(); render(true); },
  showKey: el => { const i = $('#s-key'), show = i.type === 'password'; i.type = show ? 'text' : 'password'; el.textContent = show ? 'Sembunyikan' : 'Tampilkan'; },
  wipe: async () => {
    if (!await ask('Hapus semua catatan? Semua rekaman dan teks hilang dari HP.', 'Hapus semua', 'Batal', true)) return;
    for (const s of S.sessions.slice()) await removeSession(s);
    toast('Semua catatan dihapus.');
  },
};
async function removeSession(s) {
  for (const c of s.chunks) await DB.delAudio(`${s.id}:${c.idx}`);
  await DB.del(s.id); S.sessions = S.sessions.filter(x => x !== s);
}
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'aq') { e.preventDefault(); askSend(); } });
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el && ACT[el.dataset.act]) ACT[el.dataset.act](el, e); });
document.addEventListener('input', e => {
  if (e.target.id === 'course') S.course = e.target.value;
  if (e.target.id === 'terms') S.terms = e.target.value;
  if (e.target.id === 'aq') S.aq = e.target.value;
  if (e.target.id === 'nq') {
    S.nq = e.target.value; const s = getS(S.openId), pg = $('#pg'), nc = $('#ncount');
    if (s && pg) { pg.innerHTML = pageHtml(s); if (nc) nc.textContent = countText(s); const m = $('#pg mark.hit'); if (m) m.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
  }
  if (e.target.id === 'q') { S.q = e.target.value; const el = $('#list'); if (el) el.innerHTML = listHtml(); }
  if (e.target.id === 's-key') { settings.key = e.target.value.trim(); saveSettings(); }
});

/* ---------- mulai ---------- */
if (!window.Capacitor && 'serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
(async function init() {
  db = await openDB();
  S.sessions = (await DB.all()) || [];
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  for (const s of S.sessions.slice()) {
    if (s.tmp) {
      try {
        if (!s.chunks.some(c => c.idx === s.tmp.idx)) {
          const blob = await DB.getAudio(`${s.id}:tmp`);
          if (blob) {
            await DB.putAudio(`${s.id}:${s.tmp.idx}`, blob);
            s.chunks.push({ idx: s.tmp.idx, start: s.tmp.start, dur: s.tmp.dur, status: 'error', error: 'Rekaman sempat terputus di tengah jalan.', segments: [], mime: s.tmp.mime });
            s.chunks.sort((a, b) => a.idx - b.idx);
          }
        }
        await DB.delAudio(`${s.id}:tmp`);
      } catch (e) {}
      s.tmp = null; await DB.put(s);
    }
    if (!s.chunks.length && s.status === 'recording') { await DB.del(s.id); S.sessions = S.sessions.filter(x => x !== s); continue; }
    let ch = false;
    if (s.status === 'recording') { s.status = 'done'; s.duration = s.duration || Math.round(Math.max(...s.chunks.map(c => c.start + c.dur))); ch = true; }
    for (const c of s.chunks) if (c.status === 'queued' || c.status === 'working') { c.status = 'error'; c.error = 'Proses sempat terhenti sebelum selesai.'; ch = true; }
    if (ch) await DB.put(s);
  }
  history.replaceState({ v: 'home' }, ''); render(false);
})();
})();
</script>
